<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje Detayı — Abdurrahman Bilgiç</title>
  <meta name="description" content="Proje detayları — Abdurrahman Bilgiç portfolyo" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-elevated: #12121a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --radius: 16px;
      --radius-lg: 24px;
      --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .bg-mesh::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 18px 0;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1140px, 92%);                                                                                      
      margin: 0 auto;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: var(--text);
      text-decoration: none;
    }

    .logo span { color: var(--accent-light); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .lang-switcher {
      display: flex;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 4px;
    }

    .lang-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 100px;
      cursor: pointer;
      font-family: inherit;
    }

    .lang-btn.active {
      background: var(--accent);
      color: white;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    .back-link:hover { color: var(--accent-light); }

    .project-hero {
      padding: 140px 0 60px;
    }

    .project-category {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 12px;
    }

    .project-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .project-summary {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 640px;
      margin-bottom: 40px;
    }

    .project-banner {
      width: 100%;
      aspect-ratio: 21/9;
      border-radius: var(--radius-lg);
      border: none;
      margin-bottom: 48px;
    }

    .project-cover {
      width: 100%;
      border-radius: var(--radius-lg);
      border: none;
      margin-bottom: 48px;
      overflow: hidden;
    }

    .project-cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .project-showcase {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 56px;
      margin-bottom: 32px;
      background: transparent;
      border: none;
    }

    .showcase-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: transparent;
      border: none;
    }

    .showcase-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-align: center;
      width: 100%;
    }

    .showcase-img-wrap {
      height: 420px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: transparent;
      border: none;
    }

    .showcase-item img {
      height: 100%;
      width: auto;
      max-width: none;
      display: block;
      object-fit: contain;
      object-position: bottom center;
    }

    .live-link-wrap {
      text-align: center;
      margin-bottom: 48px;
    }

    .live-link-wrap .btn svg {
      flex-shrink: 0;
    }

    .live-link-url {
      display: block;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 48px;
    }

    .detail-card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
    }

    .detail-card h3 {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .detail-card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-card li {
      color: var(--text);
      font-size: 0.95rem;
      padding-left: 16px;
      position: relative;
    }

    .detail-card li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--accent-light);
    }

    .overview {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      margin-bottom: 48px;
    }

    .overview h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      margin-bottom: 16px;
    }

    .overview p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 14px;
    }

    .overview p:last-child { margin-bottom: 0; }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 32px;
    }

    .meta-item {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .meta-item strong {
      color: var(--text);
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px var(--accent-glow);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent-light);
      background: rgba(99, 102, 241, 0.08);
    }

    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 80px;
    }

    @media (max-width: 768px) {
      html {
        scroll-padding-top: 80px;
      }

      .container {
        width: min(900px, 90%);
      }

      .nav-inner {
        width: min(1140px, 90%);
      }

      nav {
        padding: 14px 0;
      }

      .logo {
        font-size: 1.2rem;
      }

      .project-hero {
        padding: 108px 0 40px;
      }

      .project-title {
        font-size: clamp(2rem, 8vw, 2.8rem);
      }

      .project-summary {
        font-size: 1rem;
        margin-bottom: 28px;
        max-width: 100%;
      }

      .meta-row {
        flex-direction: column;
        gap: 16px;
        margin-bottom: 24px;
      }

      .project-showcase {
        flex-direction: column;
        align-items: center;
        gap: 32px;
        margin-bottom: 24px;
      }

      .showcase-item {
        width: 100%;
        max-width: 320px;
      }

      .showcase-img-wrap {
        height: 260px;
        width: 100%;
      }

      .showcase-item img {
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 260px;
      }

      .live-link-wrap {
        margin-bottom: 32px;
      }

      .live-link-wrap .btn {
        width: 100%;
        justify-content: center;
      }

      .live-link-url {
        word-break: break-all;
      }

      .overview {
        margin-bottom: 32px;
      }

      .overview h2 {
        font-size: 1.5rem;
      }

      .overview p {
        font-size: 0.98rem;
      }

      .detail-grid {
        grid-template-columns: 1fr;
        gap: 32px;
        margin-bottom: 32px;
      }

      .actions {
        flex-direction: column;
        padding-bottom: 48px;
      }

      .actions .btn {
        width: 100%;
        justify-content: center;
      }

      .back-link {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .project-hero {
        padding-top: 96px;
      }

      .project-title {
        font-size: clamp(1.85rem, 9vw, 2.4rem);
      }

      .showcase-img-wrap {
        height: 220px;
      }

      .showcase-item img {
        max-height: 220px;
      }

      .showcase-item {
        max-width: 280px;
      }

      .detail-card h3 {
        margin-bottom: 12px;
      }

      .detail-card li {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>

  <nav>

  <main class="project-hero">

    </div>
  </main>

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id') || 'plumbing';
    const project = projects[projectId];
    let currentLang = localStorage.getItem('lang') || 'tr';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      const t = ui[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      renderProject();
    }

    function renderProject() {
      if (!project) {
        document.getElementById('projectTitle').textContent = ui[currentLang]['page.notFound'];
        return;
      }

      const data = project[currentLang];

      document.title = `${project.title} — Abdurrahman Bilgiç`;
      document.getElementById('projectCategory').textContent = data.cat;
      document.getElementById('projectTitle').textContent = project.title;
      document.getElementById('projectSummary').textContent = data.summary;
      document.getElementById('projectRole').textContent = data.role;
      document.getElementById('projectYear').textContent = data.year;
      document.getElementById('projectType').textContent = data.type;

      const visual = document.getElementById('projectVisual');
      if (project.images) {
        visual.innerHTML = `
          <div class="project-showcase">
            <div class="showcase-item">
              <span class="showcase-label">${ui[currentLang]['detail.desktop']}</span>
              <div class="showcase-img-wrap">
                <img src="${project.images.desktop}" alt="${project.title} — Desktop" />
              </div>
            </div>
            <div class="showcase-item">
              <span class="showcase-label">${ui[currentLang]['detail.mobile']}</span>
              <div class="showcase-img-wrap">
                <img src="${project.images.mobile}" alt="${project.title} — Mobile" />
              </div>
            </div>
          </div>
        `;
      } else if (project.cover) {
        visual.innerHTML = `<div class="project-cover"><img src="${project.cover}" alt="${project.title}" /></div>`;
      } else {
        visual.innerHTML = `<div class="project-banner" style="background:${project.gradient}"></div>`;
      }

      const liveWrap = document.getElementById('liveLinkWrap');
      const liveLink = document.getElementById('liveProjectLink');
      if (project.liveUrl) {
        const hostname = project.liveUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
        liveWrap.hidden = false;
        liveLink.href = project.liveUrl;
        document.getElementById('liveLinkUrl').textContent = hostname;
      } else {
        liveWrap.hidden = true;
      }

      document.getElementById('overview1').textContent = data.overview1;
      document.getElementById('overview2').textContent = data.overview2;

      const featuresList = document.getElementById('featuresList');
      featuresList.innerHTML = data.features.map(f => `<li>${f}</li>`).join('');

      const techList = document.getElementById('techList');
      techList.innerHTML = project.tech.map(t => `<li>${t}</li>`).join('');
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });

    setLanguage(currentLang);
  </script>
</body>
</html>
